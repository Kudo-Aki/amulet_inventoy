<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品マスタ編集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #8B0000 0%, #B22222 100%);
            color: white;
            padding: 16px;
            text-align: center;
        }
        .header h1 {
            font-size: 1.5rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .section h2 {
            color: #8B0000;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #8B0000;
        }
        .info-box {
            background: #e3f2fd;
            border: 1px solid #2196F3;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: #1565C0;
        }
        .warning-box {
            background: #fff3e0;
            border: 1px solid #ff9800;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: #e65100;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
            min-width: 900px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f9f9f9;
            font-weight: 600;
            color: #666;
            white-space: nowrap;
        }
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #8B0000;
        }
        .input-code {
            width: 100px;
        }
        .input-name {
            min-width: 120px;
        }
        .input-quantity {
            width: 70px;
        }
        .input-price {
            width: 90px;
        }
        .input-supplier {
            min-width: 120px;
        }
        .input-contact {
            min-width: 100px;
        }
        .input-email {
            min-width: 160px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        .btn-primary {
            background: #8B0000;
            color: white;
        }
        .btn-primary:hover {
            background: #6B0000;
        }
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }
        .btn-danger {
            background: #f44336;
            color: white;
        }
        .btn-success {
            background: #4CAF50;
            color: white;
        }
        .btn-info {
            background: #2196F3;
            color: white;
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 0.875rem;
        }
        .add-form {
            display: grid;
            grid-template-columns: 1fr 1fr 80px 100px 80px 80px 1fr 1fr 1fr auto;
            gap: 10px;
            align-items: end;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }
        .add-form label {
            display: block;
            font-size: 0.875rem;
            color: #666;
            margin-bottom: 4px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 24px;
            z-index: 1000;
            display: none;
        }
        .toast.success { background: #4CAF50; }
        .toast.error { background: #f44336; }
        .toast.show { display: block; }
        .actions {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .action-group {
            margin-bottom: 16px;
        }
        .action-group h3 {
            font-size: 1rem;
            color: #666;
            margin-bottom: 8px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #8B0000;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .price-display {
            color: #2196F3;
            font-weight: bold;
        }
        @media (max-width: 600px) {
            .add-form {
                grid-template-columns: 1fr;
            }
            .input-code, .input-quantity, .input-price {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚙️ 商品マスタ編集</h1>
    </div>

    <div class="container">
        <div class="section">
            <h2>現在の商品マスタ</h2>
            <div class="info-box">
                商品コードは英大文字のみ使用できます。入数は1箱あたりのお守りの個数です。<br>
                <strong>💰 単価（税込）</strong>は発注時の請求金額計算に使用されます。<br>
                <strong>📧 発注先・担当者・メールアドレス</strong>は見積依頼メールの自動作成に使用されます。
            </div>
            <div class="table-container">
                <table id="master-table">
                    <thead>
                        <tr>
                            <th>商品コード</th>
                            <th>商品名</th>
                            <th>入数</th>
                            <th>単価(税込)</th>
                            <th>発注先</th>
                            <th>担当者</th>
                            <th>メールアドレス</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="master-tbody">
                    </tbody>
                </table>
            </div>

            <div class="add-form">
                <div>
                    <label>商品コード</label>
                    <input type="text" id="new-code" placeholder="例: OMAMORI" class="input-code">
                </div>
                <div>
                    <label>商品名</label>
                    <input type="text" id="new-name" placeholder="例: 新商品守り" class="input-name">
                </div>
                <div>
                    <label>入数</label>
                    <input type="number" id="new-quantity" placeholder="50" min="1" class="input-quantity">
                </div>
                <div>
                    <label>単価(税込)</label>
                    <input type="number" id="new-price" placeholder="0" min="0" class="input-price">
                </div>
                <div>
                    <label>現在庫</label>
                    <input type="number" id="new-stock" placeholder="0" min="0" class="input-stock">
                </div>
                <div>
                    <label>安心在庫</label>
                    <input type="number" id="new-safe-stock" placeholder="10" min="0" class="input-safe-stock">
                </div>
                <div>
                    <label>発注先</label>
                    <input type="text" id="new-supplier" placeholder="株式会社○○" class="input-supplier">
                </div>
                <div>
                    <label>担当者</label>
                    <input type="text" id="new-contact" placeholder="山田太郎" class="input-contact">
                </div>
                <div>
                    <label>メールアドレス</label>
                    <input type="email" id="new-email" placeholder="example@co.jp" class="input-email">
                </div>
                <div>
                    <button class="btn btn-success" onclick="addProduct()">追加</button>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>マスタの保存</h2>
            <div class="info-box">
                ✅ マスタはスプレッドシートに保存されます。<br>
                全ての端末で同じデータが共有されます。
            </div>
            
            <div class="action-group">
                <h3>💾 保存</h3>
                <button class="btn btn-primary" onclick="saveMaster()">📤 スプレッドシートに保存</button>
            </div>
        </div>

        <a href="index.html" class="back-link">← 管理メニューに戻る</a>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../js/api.js"></script>
    <script>
        // デフォルトマスタ（単価を追加）
        const DEFAULT_MASTER = {
            'HEALTH': { name: '健康守り', quantity: 50, unitPrice: 0, supplier: '', contact: '', email: '' },
            'MONEY': { name: '金運守り', quantity: 100, unitPrice: 0, supplier: '', contact: '', email: '' },
            'LOVE': { name: '縁結び守り', quantity: 80, unitPrice: 0, supplier: '', contact: '', email: '' },
            'TRAFFIC': { name: '交通安全守り', quantity: 60, unitPrice: 0, supplier: '', contact: '', email: '' },
            'STUDY': { name: '学業成就守り', quantity: 70, unitPrice: 0, supplier: '', contact: '', email: '' },
            'FAMILY': { name: '家内安全守り', quantity: 50, unitPrice: 0, supplier: '', contact: '', email: '' },
            'BUSINESS': { name: '商売繁盛守り', quantity: 60, unitPrice: 0, supplier: '', contact: '', email: '' },
            'CHILD': { name: '子授け守り', quantity: 40, unitPrice: 0, supplier: '', contact: '', email: '' },
            'RECOVERY': { name: '病気平癒守り', quantity: 50, unitPrice: 0, supplier: '', contact: '', email: '' },
            'LUCK': { name: '開運守り', quantity: 80, unitPrice: 0, supplier: '', contact: '', email: '' }
        };

        let master = {};

        // 初期化
        document.addEventListener('DOMContentLoaded', async () => {
            await loadMaster();
            renderTable();
        });

        // マスタ読み込み
        async function loadMaster() {
            // APIが有効な場合はAPIから取得
            if (typeof isApiEnabled === 'function' && isApiEnabled()) {
                try {
                    const data = await fetchMasterData();
                    if (data) {
                        master = data;
                        Object.keys(master).forEach(code => {
                            if (master[code].unitPrice === undefined) {
                                master[code].unitPrice = 0;
                            }
                            if (master[code].supplier === undefined) master[code].supplier = '';
                            if (master[code].contact === undefined) master[code].contact = '';
                            if (master[code].email === undefined) master[code].email = '';
                        });
                        return;
                    }
                } catch (e) {
                    console.error('APIからのマスタ取得失敗:', e);
                }
            }
            
            // localStorageから取得（フォールバック）
            const stored = localStorage.getItem('omamori_master');
            if (stored) {
                try {
                    master = JSON.parse(stored);
                    Object.keys(master).forEach(code => {
                        if (master[code].unitPrice === undefined) {
                            master[code].unitPrice = 0;
                        }
                    });
                } catch (e) {
                    master = { ...DEFAULT_MASTER };
                }
            } else {
                master = { ...DEFAULT_MASTER };
            }
        }

        // テーブル描画
        function renderTable() {
            const tbody = document.getElementById('master-tbody');
            tbody.innerHTML = '';

            Object.keys(master).sort().forEach(code => {
                const product = master[code];
                const unitPrice = product.unitPrice || 0;
                const row = document.createElement('tr');
                const supplier = product.supplier || '';
                const contact = product.contact || '';
                const email = product.email || '';
                row.innerHTML = `
                    <td><input type="text" value="${code}" data-original="${code}" onchange="updateCode(this)" class="input-code"></td>
                    <td><input type="text" value="${product.name}" onchange="updateName('${code}', this.value)" class="input-name"></td>
                    <td><input type="number" value="${product.quantity}" min="1" onchange="updateQuantity('${code}', this.value)" class="input-quantity"></td>
                    <td><input type="number" value="${unitPrice}" min="0" onchange="updatePrice('${code}', this.value)" class="input-price"></td>
                    <td><input type="text" value="${supplier}" onchange="updateSupplier('${code}', this.value)" class="input-supplier"></td>
                    <td><input type="text" value="${contact}" onchange="updateContact('${code}', this.value)" class="input-contact"></td>
                    <td><input type="email" value="${email}" onchange="updateEmail('${code}', this.value)" class="input-email"></td>
                    <td><button class="btn btn-danger btn-small" onclick="deleteProduct('${code}')">削除</button></td>
                `;
                tbody.appendChild(row);
            });
        }

        // 商品コード更新
        function updateCode(input) {
            const oldCode = input.dataset.original;
            let newCode = input.value.toUpperCase().replace(/[^A-Z]/g, '');
            input.value = newCode;

            if (newCode && newCode !== oldCode) {
                if (master[newCode]) {
                    showToast('このコードは既に使用されています', 'error');
                    input.value = oldCode;
                    return;
                }
                master[newCode] = master[oldCode];
                delete master[oldCode];
                input.dataset.original = newCode;
                renderTable(); // 再描画して他のイベントハンドラを更新
                showToast('商品コードを更新しました', 'success');
            }
        }

        // 商品名更新
        function updateName(code, name) {
            if (master[code]) {
                master[code].name = name;
                showToast('商品名を更新しました', 'success');
            }
        }

        // 入数更新
        function updateQuantity(code, quantity) {
            if (master[code]) {
                master[code].quantity = parseInt(quantity) || 1;
                showToast('入数を更新しました', 'success');
            }
        }

        // 単価更新
        function updatePrice(code, price) {
            if (master[code]) {
                master[code].unitPrice = parseInt(price) || 0;
                showToast('単価を更新しました', 'success');
            }
        }

        // 発注先更新
        function updateSupplier(code, supplier) {
            if (master[code]) {
                master[code].supplier = supplier;
                showToast('発注先を更新しました', 'success');
            }
        }

        // 担当者更新
        function updateContact(code, contact) {
            if (master[code]) {
                master[code].contact = contact;
                showToast('担当者を更新しました', 'success');
            }
        }

        // メールアドレス更新
        function updateEmail(code, email) {
            if (master[code]) {
                master[code].email = email;
                showToast('メールアドレスを更新しました', 'success');
            }
        }

        // 商品追加
        async function addProduct() {
            let code = document.getElementById('new-code').value.toUpperCase().replace(/[^A-Z]/g, '');
            const name = document.getElementById('new-name').value.trim();
            const quantity = parseInt(document.getElementById('new-quantity').value) || 50;
            const unitPrice = parseInt(document.getElementById('new-price').value) || 0;
            const stock = parseInt(document.getElementById('new-stock').value) || 0;
            const safeStock = parseInt(document.getElementById('new-safe-stock').value) || 10;
            const supplier = document.getElementById('new-supplier').value.trim();
            const contact = document.getElementById('new-contact').value.trim();
            const email = document.getElementById('new-email').value.trim();

            if (!code) {
                showToast('商品コードを入力してください', 'error');
                return;
            }
            if (!name) {
                showToast('商品名を入力してください', 'error');
                return;
            }
            if (master[code]) {
                showToast('このコードは既に使用されています', 'error');
                return;
            }

            // マスタに追加
            master[code] = { name, quantity, unitPrice, supplier, contact, email };
            
            // ローカルに保存
            localStorage.setItem('omamori_master', JSON.stringify(master));
            
            // 在庫データも保存
            let stockData = JSON.parse(localStorage.getItem('omamori_stock') || '{}');
            stockData[code] = { stock: stock, safeStock: safeStock };
            localStorage.setItem('omamori_stock', JSON.stringify(stockData));
            
            // 発注データも初期化
            let orderData = JSON.parse(localStorage.getItem('omamori_orders') || '{}');
            orderData[code] = { ordered: false, quantity: 0, deliveryDate: '' };
            localStorage.setItem('omamori_orders', JSON.stringify(orderData));
            
            // APIが有効ならスプレッドシートにも即座に保存
            if (typeof isApiEnabled === 'function' && isApiEnabled()) {
                showToast('🔄 スプレッドシートに保存中...', 'info');
                try {
                    // 商品データをスプレッドシートに保存
                    const productData = {
                        code: code,
                        name: name,
                        quantity: quantity,
                        unitPrice: unitPrice,
                        supplier: supplier,
                        contact: contact,
                        email: email,
                        stock: stock,
                        safeStock: safeStock,
                        ordered: false,
                        orderQuantity: 0,
                        deliveryDate: ''
                    };
                    await saveProductToSpreadsheet(productData);
                    showToast('✅ 商品を追加しました（スプレッドシートに保存済み）', 'success');
                } catch (e) {
                    console.error('スプレッドシート保存エラー:', e);
                    showToast('⚠️ 商品を追加しました（ローカルのみ）', 'info');
                }
            } else {
                showToast('✅ 商品を追加しました', 'success');
            }
            
            renderTable();

            // フォームクリア
            document.getElementById('new-code').value = '';
            document.getElementById('new-name').value = '';
            document.getElementById('new-quantity').value = '';
            document.getElementById('new-price').value = '';
            document.getElementById('new-stock').value = '';
            document.getElementById('new-safe-stock').value = '';
            document.getElementById('new-supplier').value = '';
            document.getElementById('new-contact').value = '';
            document.getElementById('new-email').value = '';
        }
        
        // 商品をスプレッドシートに保存
        async function saveProductToSpreadsheet(productData) {
            if (typeof apiPost === 'function') {
                return await apiPost('saveProduct', { data: productData });
            }
            throw new Error('APIが利用できません');
        }

        // 商品削除
        function deleteProduct(code) {
            if (confirm(`「${master[code].name}」を削除しますか？`)) {
                delete master[code];
                renderTable();
                showToast('商品を削除しました', 'success');
            }
        }

        // ブラウザに保存
        async function saveMaster() {
            localStorage.setItem('omamori_master', JSON.stringify(master));
            
            // APIにも保存
            if (typeof isApiEnabled === 'function' && isApiEnabled()) {
                try {
                    await saveMasterDataToApi(master);
                } catch (e) {
                    console.error('APIへのマスタ保存失敗:', e);
                }
            }
            
            showToast('マスタを保存しました', 'success');
        }

        // トースト表示
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => {
                toast.className = 'toast';
            }, 2000);
        }
    </script>
</body>
</html>
